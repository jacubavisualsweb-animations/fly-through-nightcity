<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neon City Canyon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    #info {
      position: fixed;
      top: 8px;
      left: 10px;
      font-size: 12px;
      z-index: 10;
      opacity: 0.7;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="info">Loading…</div>

  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    const info = document.getElementById('info');

    if (typeof THREE === 'undefined') {
      info.textContent = 'THREE undefined – zkontroluj internet / CDN.';
    } else {
      // ============== SCÉNA ==============
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x02030a);
      scene.fog = new THREE.Fog(0x02030a, 40, 260);

      // ============== KAMERA ==============
      const camera = new THREE.PerspectiveCamera(
        80,
        window.innerWidth / window.innerHeight,
        0.1,
        500
      );
      camera.position.set(0, 7, 8);
      camera.lookAt(0, 6, -40);

      // ============== RENDERER ==============
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      // (držím to jednoduché – žádné extra encodingy)
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // ============== SVĚTLA ==============
      const ambient = new THREE.AmbientLight(0x88aaff, 0.5);
      scene.add(ambient);

      const dirLight = new THREE.DirectionalLight(0x66ccff, 1.2);
      dirLight.position.set(40, 60, 20);
      scene.add(dirLight);

      const pulseLight = new THREE.PointLight(0xff66ff, 2.0, 120);
      pulseLight.position.set(0, 10, -20);
      scene.add(pulseLight);

      // ============== PARAMETRY MĚSTA ==============
      const streetWidth = 18;      // šířka uličky (průlet)
      const cityWidth = 120;        // rozsah budov do stran (x)
      const spacingX   = 6;        // rozestup budov v X
      const spacingZ   = 9;        // rozestup budov v Z
      const depthPerSegment = 16;  // počet řad budov na segment
      const segmentLength   = depthPerSegment * spacingZ;

      // ============== GEOMETRIE A MATERIÁLY ==============
      const floorGeo = new THREE.PlaneGeometry(260, segmentLength);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x050910,
        metalness: 0.3,
        roughness: 0.8
      });

      const buildingGeo = new THREE.BoxGeometry(3, 1, 3); // výška pak přes scale.y
      const baseBuildingMat = new THREE.MeshStandardMaterial({
        color: 0x101525,
        metalness: 0.6,
        roughness: 0.4,
        emissive: 0x2233aa,
        emissiveIntensity: 0.6
      });

      // ============== FUNKCE: SEGMENT MĚSTSKÉ ULICE ==============
      function createSegment(offsetZ) {
        const group = new THREE.Group();
        group.position.z = offsetZ;

        // PODLAHA
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.position.z = -segmentLength / 2;
        group.add(floor);

        const buildings = [];
        const xPositions = [];

        // x od -cityWidth do -streetWidth/2
        for (let x = -cityWidth; x <= -streetWidth / 2; x += spacingX) {
          xPositions.push(x);
        }
        // x od streetWidth/2 do +cityWidth
        for (let x = streetWidth / 2; x <= cityWidth; x += spacingX) {
          xPositions.push(x);
        }

        for (let xi = 0; xi < xPositions.length; xi++) {
          const x = xPositions[xi];
          for (let i = 0; i < depthPerSegment; i++) {
            const localZ = -i * spacingZ;

            const h = 6 + Math.random() * 28;
            const mat = baseBuildingMat.clone();
            mat.emissiveIntensity = 0.4 + Math.random() * 0.4;

            const building = new THREE.Mesh(buildingGeo, mat);
            building.scale.y = h;
            building.position.set(x, h / 2, localZ);
            building.userData.phase = Math.random() * Math.PI * 2;

            buildings.push(building);
            group.add(building);
          }
        }

        group.userData.buildings = buildings;
        scene.add(group);
        return group;
      }

      // ============== SEGMENTY A & B ==============
      const segments = [];
      const segmentA = createSegment(0);
      const segmentB = createSegment(-segmentLength);
      segments.push(segmentA, segmentB);

      // ============== RYCHLOST LETU ==============
      const startSpeed = 0.05;
      const maxSpeed   = 0.9;
      let speed        = startSpeed;
      const accel      = (maxSpeed - startSpeed) / (35 * 60); // cca 35s

      let t = 0;

      // ============== RESIZE ==============
      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      });

      // ============== ANIMACE ==============
      function animate() {
        requestAnimationFrame(animate);
        t += 0.016;

        if (speed < maxSpeed) {
          speed += accel;
        }

        // kamera v ose ulice
        camera.position.set(0, 7, 8);
        camera.lookAt(0, 6, -40);

        // pulzující světlo nad ulicí
        const pulse = (Math.sin(t * 2.1) + 1) / 2; // 0–1
        pulseLight.intensity = 1.2 + pulse * 1.8;
        pulseLight.position.set(
          Math.sin(t * 0.4) * 6,
          10 + Math.sin(t * 0.7) * 2,
          -18
        );

        // blikání emissive na budovách
        for (let si = 0; si < segments.length; si++) {
          const seg = segments[si];
          const buildings = seg.userData.buildings || [];
          for (let bi = 0; bi < buildings.length; bi++) {
            const b = buildings[bi];
            const p = b.userData.phase || 0;
            const flicker = 0.3 + 0.4 * (Math.sin(t * 3.0 + p) * 0.5 + 0.5);
            b.material.emissiveIntensity = flicker;
          }
        }

        // posun segmentů kameře vstříc
        for (let si = 0; si < segments.length; si++) {
          const seg = segments[si];
          seg.position.z += speed;

          if (seg.position.z > segmentLength) {
            seg.position.z -= segmentLength * 2;
          }
        }

        renderer.render(scene, camera);

        info.textContent =
          'Neon City | Speed: ' + speed.toFixed(3) +
          ' | SegmentLength: ' + segmentLength;
      }

      animate();
    }
  </script>
</body>
</html>
